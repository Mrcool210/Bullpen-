name: tmp-sync284
on: push
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Sync 2.8.4 build files and self-delete
        run: |
          cp Bullpen-2_8_1.html Bullpen-2_8.html
          cp Bullpen-2_8_1.html index.html
          rm Bullpen-2_8_1.html
          rm .github/workflows/tmp-sync284.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bullpen 2.8.4: sync build files (Bullpen-2_8.html and index.html)"
          git push

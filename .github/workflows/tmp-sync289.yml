name: tmp-sync289
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync build files and self-remove
        run: |
          cp Bullpen-2_8_1.html Bullpen-2_8.html
          cp Bullpen-2_8_1.html index.html
          rm Bullpen-2_8_1.html
          rm .github/workflows/tmp-sync289.yml
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Bullpen 2.8.8: sync Bullpen-2_8.html and index.html, remove temp files"
          git push

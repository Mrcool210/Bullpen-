name: Sync index.html (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy new build to index.html and push
        run: |
          cp Bullpen-2_8.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Set index.html byte-identical to Bullpen-2_8.html (new build)" || echo "nothing to commit"
          git push
